{% include base_path %}

<!-- start custom head snippets -->

<!-- Theme bootstrap: light is the default for everyone; a saved "dark" choice is
     applied before first paint so there is no flash of the wrong theme. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "dark" && t !== "light") { localStorage.setItem("theme", "light"); t = "light"; }
      if (t === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    } catch (e) {}
  })();
</script>

<!-- Fonts: Manrope and Courier Prime are self-hosted in assets/fonts/kit (SIL OFL) and
     declared in _sass/_kit.scss, so no third-party font service is contacted. -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- VLM monogram icon: white Manrope "VLM" on navy with the blue title rule -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/vlm-apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/vlm-favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/vlm-favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/vlm-favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/vlm-favicon.ico"/>
<meta name="theme-color" content="#13294B"/>

<!-- end custom head snippets -->
